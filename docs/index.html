<!--
  ============================================================================
  DEMO PAGE — From Tokens to Faces
  ============================================================================
  Como usar:
  1. Coloque este arquivo na pasta /docs do seu repo (ou na branch gh-pages).
  2. Crie uma pasta "videos/" ao lado dele e jogue os .mp4 lá dentro.
  3. Edite SÓ o objeto CONFIG abaixo (logo no início do <script>):
     - metadados do paper, autores e links
     - lista de amostras, cada uma com os vídeos por encoder|decoder
  4. Ative em Settings -> Pages, apontando para /docs (ou gh-pages).

  Estrutura de pastas sugerida:
     docs/
       index.html
       videos/
         sample1/hubert_gru.mp4, cosyvoice2_transformer.mp4, ...
         sample2/...
         avtts/result1.mp4, result2.mp4, ...

  Observação: o GitHub Pages NÃO serve arquivos do Git LFS pela URL.
  Commite os .mp4 normalmente (clipes de ~4MB ficam ok).
  ============================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>From Tokens to Faces</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #0d0f15;
    --bg-soft:   #12141c;
    --surface:   #171a24;
    --surface-2: #1d2130;
    --border:    #272c3a;
    --border-lit:#3a4154;
    --text:      #e9ebf0;
    --text-dim:  #9aa2b4;
    --text-mute: #646c80;
    --accent:    #ff6a45;
    --accent-dim:#b8472b;
    --token:     #2a3142;
    --maxw: 1080px;
    --r: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(900px 500px at 80% -10%, rgba(255,106,69,.06), transparent 60%),
      radial-gradient(700px 400px at 0% 0%, rgba(90,120,255,.04), transparent 55%);
  }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  /* ---------- token strip (signature) ---------- */
  .tokens {
    display: flex; flex-wrap: wrap; gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: .02em;
  }
  .tok {
    background: var(--token);
    color: var(--text-dim);
    padding: 4px 9px;
    border-radius: 5px;
    border: 1px solid transparent;
    user-select: none;
  }
  .tok.hot { color: var(--accent); border-color: var(--accent-dim); background: rgba(255,106,69,.08); }

  /* ---------- hero ---------- */
  header.hero { padding: 88px 0 56px; text-align: center; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 26px;
  }
  h1.title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; line-height: 1.02;
    font-size: clamp(40px, 8vw, 76px);
    letter-spacing: -.02em;
  }
  h1.title .arrow { color: var(--accent); font-weight: 500; }
  .subtitle {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 400; color: var(--text-dim);
    font-size: clamp(16px, 2.4vw, 21px);
    max-width: 720px; margin: 20px auto 0;
  }
  .hero-tokens { justify-content: center; margin: 40px auto 0; max-width: 620px; }

  .authors { margin-top: 38px; color: var(--text); font-size: 16px; }
  .authors a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border-lit); }
  .authors a:hover { color: var(--accent); border-color: var(--accent); }
  .affil { margin-top: 12px; color: var(--text-mute); font-size: 13.5px; font-family: 'JetBrains Mono', monospace; }

  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 34px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 100px;
    font-size: 14.5px; font-weight: 500; text-decoration: none;
    border: 1px solid var(--border-lit); color: var(--text);
    background: var(--surface); transition: all .15s ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .btn.primary { background: var(--accent); color: #1a0d08; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { background: #ff7d5c; color: #1a0d08; }
  .btn svg { width: 16px; height: 16px; }

  /* ---------- sections ---------- */
  section { padding: 56px 0; }
  .sec-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
  .sec-num {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--accent); letter-spacing: .1em;
  }
  h2.sec-title {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    font-size: clamp(26px, 4vw, 36px); letter-spacing: -.015em;
  }
  .sec-desc { color: var(--text-dim); max-width: 760px; margin-top: 14px; font-size: 16px; }

  .divider { border: 0; border-top: 1px solid var(--border); margin: 0; }

  /* ---------- avtts results ---------- */
  .avtts-grid {
    display: grid; gap: 20px; margin-top: 28px;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  }
  .avtts-item {
    border-radius: var(--r); overflow: hidden;
    border: 1px solid var(--border); background: #000;
    box-shadow: 0 18px 44px -28px rgba(0,0,0,.8);
  }
  .avtts-item video { display: block; width: 100%; height: auto; }
  .avtts-item .cap {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text-dim); padding: 10px 14px;
    border-top: 1px solid var(--border); background: var(--bg-soft);
  }

  /* ---------- comparison grid ---------- */
  .sample-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 12px; }
  .tab {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    transition: all .15s ease;
  }
  .tab:hover { color: var(--text); border-color: var(--border-lit); }
  .tab.active { background: rgba(255,106,69,.1); color: var(--accent); border-color: var(--accent-dim); }

  .transcript {
    margin: 18px 0 26px; padding: 14px 18px;
    background: var(--bg-soft); border-left: 2px solid var(--accent);
    border-radius: 0 8px 8px 0; color: var(--text-dim); font-size: 15px;
  }
  .transcript .lbl { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-mute); display: block; margin-bottom: 4px; }

  .gt-block { margin-bottom: 34px; }
  .gt-block .col-title { margin-bottom: 10px; }
  .gt-wrap { max-width: 520px; }

  /* matrix: header row of decoders + one row per encoder */
  .matrix { display: grid; gap: 14px; }
  .matrix-head, .matrix-row {
    display: grid;
    grid-template-columns: 130px 1fr 1fr;
    gap: 14px; align-items: center;
  }
  .corner { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-mute); }
  .col-title {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px;
    text-align: center; color: var(--text);
  }
  .row-label {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500;
    color: var(--text); padding-right: 6px;
  }
  .row-label .tag { display: block; color: var(--text-mute); font-size: 11px; margin-top: 2px; font-weight: 400; }

  .cell { border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #000; }
  .cell video { display: block; width: 100%; height: auto; }
  .cell.empty {
    display: flex; align-items: center; justify-content: center;
    min-height: 120px; background: var(--bg-soft); color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; border-style: dashed;
  }

  /* ---------- citation ---------- */
  .cite-box {
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: var(--r); padding: 22px 24px; margin-top: 22px;
    position: relative;
  }
  .cite-box pre {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    color: var(--text-dim); white-space: pre-wrap; word-break: break-word; line-height: 1.7;
  }
  .copy-btn {
    position: absolute; top: 16px; right: 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border-lit); color: var(--text-dim);
  }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

  footer { padding: 50px 0 70px; text-align: center; color: var(--text-mute); font-size: 13px; }
  footer a { color: var(--text-dim); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  /* ---------- responsive ---------- */
  @media (max-width: 760px) {
    .matrix-head, .matrix-row { grid-template-columns: 1fr; }
    .matrix-head .corner { display: none; }
    .row-label { padding: 8px 0 2px; border-top: 1px solid var(--border); }
    .matrix-head .col-title { display: none; }
    .cell::before {
      content: attr(data-label);
      display: block; font-family: 'JetBrains Mono', monospace;
      font-size: 11px; color: var(--text-mute);
      padding: 8px 10px 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .btn:hover { transform: none; }
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow" id="venue"></p>
    <h1 class="title" id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="tokens hero-tokens" id="hero-tokens"></div>
    <p class="authors" id="authors"></p>
    <p class="affil" id="affil"></p>
    <div class="links" id="links"></div>
  </div>
</header>

<hr class="divider" />

<!-- 01 — Encoder x Decoder comparison -->
<section id="comparison">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-num">01</span>
      <h2 class="sec-title">Encoders &times; decoders</h2>
    </div>
    <p class="sec-desc">Same utterance animated from four discrete speech representations, each paired with both decoder architectures. Pick a sample to compare.</p>

    <div class="sample-tabs" id="sample-tabs"></div>
    <div id="transcript-slot"></div>
    <div id="gt-slot"></div>

    <div class="matrix" id="matrix"></div>
  </div>
</section>

<hr class="divider" />

<!-- 02 — AVTTS results -->
<section id="avtts">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-num">02</span>
      <h2 class="sec-title">AVTTS results</h2>
    </div>
    <p class="sec-desc" id="avtts-desc"></p>
    <div class="avtts-grid" id="avtts-grid"></div>
  </div>
</section>

<hr class="divider" />

<!-- 03 — Citation -->
<section id="citation">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-num">03</span>
      <h2 class="sec-title">Citation</h2>
    </div>
    <div class="cite-box">
      <button class="copy-btn" id="copy-cite">copy</button>
      <pre id="bibtex"></pre>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p id="footer-text"></p>
  </div>
</footer>

<script>
/* ===========================================================================
   EDITE APENAS ESTE OBJETO  →  o resto da página se monta sozinho.
   =========================================================================== */
const CONFIG = {
  venue:    "Interspeech 2026",
  title:    "From Tokens <span class='arrow'>&rarr;</span> Faces",
  subtitle: "Investigating Discrete Speech Representations for 3D Facial Animation",

  // Use HTML em author/affil se quiser superscripts (ex: "Nome<sup>1</sup>")
  authors:  "Pedro R. Correa<sup>1,2,**</sup>, Olivier Perrotin<sup>2</sup>, Samir Sadok<sup>3</sup>, Paula D. P. Costa<sup>1</sup>, Thomas Hueber<sup>2,**</sup>",
  affil:    "1 — Univ. Estadual de Campinas (UNICAMP), Brazil<br>2 — Univ. Grenoble Alpes, CNRS, Grenoble INP, GIPSA-lab, France<br>3 — Inria at Univ. Grenoble Alpes, CNRS, LJK, France",

  links: [
    { label: "Paper",  href: "#", primary: true, icon: "doc" },
    { label: "Code",   href: "https://github.com/SEU-USUARIO/SEU-REPO", icon: "github" },
    { label: "BibTeX", href: "#citation", icon: "quote" },
  ],

  // Tokens decorativos do hero (puramente visual; troque os números à vontade)
  heroTokens: [482, 119, 7, 256, 88, 401, 33, 290, 512, 64, 178, 9, 355, 21],

  encoders: ["HuBERT", "CosyVoice2", "SpeechTokenizer", "WavTokenizer"],
  decoders: ["GRU", "Transformer"],

  // Resultados do AVTTS (sem diagrama de fluxo) — só os vídeos.
  // Adicione quantos quiser; cada um vira um tile no grid.
  // caption é opcional ("" para esconder a legenda).
  avtts: {
    description: "Full audio-visual TTS results: speech and facial animation generated end to end.",
    videos: [
      { src: "videos/avtts/result1.mp4", caption: "Sample 1" },
      { src: "videos/avtts/result2.mp4", caption: "Sample 2" },
    ],
  },

  // Uma entrada por amostra. As chaves de "videos" são "ENCODER|DECODER".
  // Deixe vazio "" qualquer combinação que você não tiver — vira placeholder.
  samples: [
    {
      label: "Sample 1",
      transcript: "(opcional) transcrição da frase desta amostra.",
      groundTruth: "videos/sample1/ground_truth.mp4",   // "" para esconder
      videos: {
        "HuBERT|GRU":            "videos/sample1/hubert_gru.mp4",
        "HuBERT|Transformer":    "videos/sample1/hubert_transformer.mp4",
        "CosyVoice2|GRU":        "videos/sample1/cosyvoice2_gru.mp4",
        "CosyVoice2|Transformer":"videos/sample1/cosyvoice2_transformer.mp4",
        "SpeechTokenizer|GRU":         "videos/sample1/speechtokenizer_gru.mp4",
        "SpeechTokenizer|Transformer": "videos/sample1/speechtokenizer_transformer.mp4",
        "WavTokenizer|GRU":            "videos/sample1/wavtokenizer_gru.mp4",
        "WavTokenizer|Transformer":    "videos/sample1/wavtokenizer_transformer.mp4",
      },
    },
    {
      label: "Sample 2",
      transcript: "",
      groundTruth: "",
      videos: {
        "HuBERT|GRU": "videos/sample2/hubert_gru.mp4",
        "HuBERT|Transformer": "videos/sample2/hubert_transformer.mp4",
        "CosyVoice2|GRU": "videos/sample2/cosyvoice2_gru.mp4",
        "CosyVoice2|Transformer": "videos/sample2/cosyvoice2_transformer.mp4",
        "SpeechTokenizer|GRU": "videos/sample2/speechtokenizer_gru.mp4",
        "SpeechTokenizer|Transformer": "videos/sample2/speechtokenizer_transformer.mp4",
        "WavTokenizer|GRU": "videos/sample2/wavtokenizer_gru.mp4",
        "WavTokenizer|Transformer": "videos/sample2/wavtokenizer_transformer.mp4",
      },
    },
  ],

  bibtex: `@inproceedings{tokens2faces2026,
  title     = {From Tokens to Faces: Investigating Discrete Speech
               Representations for 3D Facial Animation},
  author    = {Correa, Pedro R. and Perrotin, Olivier and Sadok, Samir
               and Costa, Paula D. P. and Hueber, Thomas},
  booktitle = {Proc. Interspeech 2026},
  year      = {2026},
}`,

  footer: "Project page for the Interspeech 2026 paper. Built as a static page on GitHub Pages.",
};

/* ===========================================================================
   Render — normalmente você não precisa mexer daqui pra baixo.
   =========================================================================== */
const $ = (id) => document.getElementById(id);

const ICONS = {
  doc:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.6 2 12.2c0 4.5 2.9 8.3 6.8 9.6.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0 0 22 12.2C22 6.6 17.5 2 12 2z"/></svg>',
  quote:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h4v4H7zM13 7h4v4h-4z"/><path d="M7 11c0 3-1 4-3 5M13 11c0 3-1 4-3 5"/></svg>',
};

function render() {
  $("venue").textContent = CONFIG.venue;
  $("title").innerHTML = CONFIG.title;
  $("subtitle").textContent = CONFIG.subtitle;
  $("authors").innerHTML = CONFIG.authors;
  $("affil").innerHTML = CONFIG.affil;
  $("footer-text").textContent = CONFIG.footer;

  // hero tokens
  $("hero-tokens").innerHTML = CONFIG.heroTokens
    .map((t, i) => `<span class="tok${i % 4 === 2 ? " hot" : ""}">${t}</span>`).join("");

  // links
  $("links").innerHTML = CONFIG.links.map(l =>
    `<a class="btn${l.primary ? " primary" : ""}" href="${l.href}">${ICONS[l.icon] || ""}${l.label}</a>`
  ).join("");

  // avtts results
  $("avtts-desc").textContent = CONFIG.avtts.description;
  $("avtts-grid").innerHTML = CONFIG.avtts.videos.map(v =>
    `<div class="avtts-item">
       <video controls preload="metadata" playsinline src="${v.src}"></video>
       ${v.caption ? `<div class="cap">${v.caption}</div>` : ""}
     </div>`
  ).join("");

  // sample tabs
  $("sample-tabs").innerHTML = CONFIG.samples.map((s, i) =>
    `<button class="tab${i === 0 ? " active" : ""}" data-idx="${i}">${s.label}</button>`
  ).join("");
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      renderSample(+tab.dataset.idx);
    });
  });

  // bibtex
  $("bibtex").textContent = CONFIG.bibtex;
  $("copy-cite").addEventListener("click", () => {
    navigator.clipboard.writeText(CONFIG.bibtex).then(() => {
      const b = $("copy-cite"); b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1500);
    });
  });

  renderSample(0);
}

function videoCell(src, label) {
  if (!src) return `<div class="cell empty" data-label="${label}">no sample</div>`;
  return `<div class="cell" data-label="${label}">
    <video controls preload="metadata" playsinline src="${src}"></video>
  </div>`;
}

function renderSample(idx) {
  const s = CONFIG.samples[idx];

  // transcript
  $("transcript-slot").innerHTML = s.transcript
    ? `<div class="transcript"><span class="lbl">Transcript</span>${s.transcript}</div>` : "";

  // ground truth
  $("gt-slot").innerHTML = s.groundTruth
    ? `<div class="gt-block"><p class="col-title" style="text-align:left">Ground truth</p>
         <div class="gt-wrap">${videoCell(s.groundTruth, "Ground truth")}</div></div>` : "";

  // matrix: header (decoders) + one row per encoder
  let html = `<div class="matrix-head">
      <span class="corner">encoder \\ decoder</span>
      ${CONFIG.decoders.map(d => `<span class="col-title">${d}</span>`).join("")}
    </div>`;

  html += CONFIG.encoders.map(enc => {
    const cells = CONFIG.decoders.map(dec =>
      videoCell(s.videos[`${enc}|${dec}`], `${enc} · ${dec}`)
    ).join("");
    return `<div class="matrix-row">
        <div class="row-label">${enc}</div>
        ${cells}
      </div>`;
  }).join("");

  $("matrix").innerHTML = html;
}

render();
</script>
</body>
</html>
